name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Disposable-store integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n menu.bash && bash -n tests/integration.sh
      - name: Run disposable-store integration tests
        run: bash tests/integration.sh
